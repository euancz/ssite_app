name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_url:
        description: Dart backend URL reachable from the Android device
        type: string
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub
      - name: Build release APK
        env:
          MOBILE_SERVICE_URL: ${{ inputs.backend_url || vars.SSITE_BACKEND_URL || 'http://localhost:8001' }}
        run: flutter build apk --release --no-pub --dart-define="SSITE_BACKEND_URL=$MOBILE_SERVICE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: SSITE-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
